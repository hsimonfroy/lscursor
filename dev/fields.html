<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lscursor — field check</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css">
<style>
  body { padding: 24px; max-width: 1100px; }
  table { border-collapse: collapse; width: 100%; font-family: ui-monospace, monospace; font-size: 12px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--grid); }
  th { color: var(--ink-muted); font-weight: 500; }
  td.n { text-align: right; }
  .pass { color: #46a546; } .fail { color: #d9534f; }
  h2 { font-size: 14px; margin: 26px 0 8px; }
  #slices { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
  figure { margin: 0; } figcaption { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  #slices canvas { image-rendering: pixelated; border-radius: 4px; }
  #caps { color: var(--ink-muted); font-size: 12px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>lscursor — field check</h1>
<p class="sub">Phase 3 gate. The variance rows compare the synthesised field against the
analytic sum over the discrete mode grid — that single number catches any error in the
noise normalisation, the P(k) lookup, the 1/k² kernel or the FFT scaling.</p>
<div id="caps"></div>
<p id="status" style="font-family:ui-monospace,monospace;font-size:12px;color:var(--ink-muted)">starting…</p>
<div id="out"></div>
<div id="slices"></div>
<canvas id="gl" width="1" height="1" style="display:none"></canvas>

<script type="module">
import { createContext } from '../src/gl/context.js';
import { readFloat } from '../src/gl/glutil.js';
import { makeIndexer } from '../src/gl/fft.js';
import { Pipeline } from '../src/sim/pipeline.js';
import { linearPower } from '../src/cosmo/power.js';
import { derive, createState, GEOM } from '../src/state.js';

const { gl, caps } = createContext(document.getElementById('gl'));
document.getElementById('caps').textContent = gl ? `renderer: ${caps.renderer}` : 'no WebGL2';
if (!gl) throw new Error('no WebGL2');

const rows = [];
const out = document.getElementById('out');
function section(t) { rows.push(`<h2>${t}</h2><table><tr><th>quantity</th><th class="n">measured</th><th class="n">analytic</th><th class="n">ratio</th><th>result</th></tr>`); }
function row(q, m, a, tol) {
  const r = m / a;
  rows.push(`<tr><td>${q}</td><td class="n">${m.toPrecision(5)}</td><td class="n">${a.toPrecision(5)}</td>` +
            `<td class="n">${r.toFixed(4)}</td><td class="${Math.abs(r - 1) < tol ? 'pass' : 'fail'}">${Math.abs(r - 1) < tol ? 'PASS' : 'FAIL'}</td></tr>`);
}
function endSection() { rows.push('</table>'); flush(); }
function flush() { out.innerHTML = rows.join('') + (rows.filter(r => r.startsWith('<h2>')).length > rows.filter(r => r === '</table>').length ? '</table>' : ''); }
const status = document.getElementById('status');
/** Paint, then hand the frame back to the browser so the page stays alive. */
const tick = (msg) => new Promise((r) => { status.textContent = msg; flush(); requestAnimationFrame(() => setTimeout(r, 0)); });

const st = createState();
const d = derive(st);

/** log-k lookup so the mode loop does not re-derive Eisenstein-Hu per mode. */
function pkLookup(cosmo, A, kmin, kmax, n = 4096) {
  const logK0 = Math.log(kmin * 0.5), dlog = (Math.log(kmax * 2) - logK0) / (n - 1);
  const k = new Float64Array(n);
  for (let i = 0; i < n; i++) k[i] = Math.exp(logK0 + i * dlog);
  const P = linearPower(k, cosmo, A);
  return (kv) => {
    const t = Math.min(n - 1, Math.max(0, (Math.log(kv) - logK0) / dlog));
    const i = t | 0, j = Math.min(i + 1, n - 1), f = t - i;
    return P[i] + f * (P[j] - P[i]);
  };
}

/** Analytic variance of delta_L and Psi_x over the discrete mode grid. */
function analytic(grid, cosmo, A, smoothR) {
  const { nx, ny, nz, boxXY, boxZ } = grid;
  const kfx = 2 * Math.PI / boxXY, kfz = 2 * Math.PI / boxZ;
  const V = boxXY * boxXY * boxZ;
  const wrap = (i, n) => (i <= n / 2 ? i : i - n);
  // cache P(k) by |k| via the same LUT-free path the theory uses
  // Also accumulate the EFFECTIVE number of contributing modes,
  //   N_eff = (sum w)^2 / sum w^2,
  // because Var[Psi] is dominated by a handful of large-scale modes and a single
  // realisation therefore scatters by sqrt(2/N_eff) around the ensemble mean.
  // Comparing one realisation to the ensemble value without that allowance was
  // what made this test look like a 10% bug in the gradient kernel.
  let varD = 0, varPsi = 0, sumD2 = 0, sumP2 = 0;
  const Pof = pkLookup(cosmo, A, kfx, 2 * Math.sqrt(3) * Math.PI * nx / boxXY);
  for (let iz = 0; iz < nz; iz++) {
    const kz = wrap(iz, nz) * kfz;
    for (let iy = 0; iy < ny; iy++) {
      const ky = wrap(iy, ny) * kfx;
      for (let ix = 0; ix < nx; ix++) {
        const kx = wrap(ix, nx) * kfx;
        const k2 = kx * kx + ky * ky + kz * kz;
        if (k2 === 0) continue;
        const P = Pof(Math.sqrt(k2));
        const sm = Math.exp(-k2 * smoothR * smoothR);
        const wD = P * sm, wP = (kx * kx / (k2 * k2)) * P;
        varD += wD; sumD2 += wD * wD;
        varPsi += wP; sumP2 += wP * wP;
      }
    }
  }
  return {
    varD: varD / V, varPsi: varPsi / V,
    nEffD: (varD * varD) / sumD2, nEffPsi: (varPsi * varPsi) / sumP2,
  };
}

function measure(gl, pipe, grid) {
  const { nx, ny, nz } = grid;
  const buf = readFloat(gl, pipe.volumeFb, pipe.vol.atlasW, pipe.vol.atlasH);
  const ix = makeIndexer(nx, ny, nz);
  let sPx = 0, sPy = 0, sD = 0, s2Px = 0, s2Py = 0, s2D = 0, sImg = 0, n = 0;
  for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const o = ix.at(x, y, z) * 4;
    const px = buf[o], py = buf[o + 1], dl = buf[o + 2], im = buf[o + 3];
    sPx += px; sPy += py; sD += dl; sImg += im * im;
    s2Px += px * px; s2Py += py * py; s2D += dl * dl; n++;
  }
  return {
    varPsiX: s2Px / n - (sPx / n) ** 2,
    varPsiY: s2Py / n - (sPy / n) ** 2,
    varD: s2D / n - (sD / n) ** 2,
    meanD: sD / n,
    spurIm: Math.sqrt(sImg / n),
    buf, ix,
  };
}

const SMOOTH_R = 4.0;
for (const [nx, ny, nz, label] of [[64, 64, 16, 'small 64x64x16'], [128, 128, 32, 'draft 128x128x32']]) {
  const grid = { nx, ny, nz, slabCells: 8, boxXY: GEOM.boxXY, boxZ: GEOM.boxXY * (nz / nx) };
  // full3d: this gate checks the whole k-space cube and 3-D volume, which the
  // default slab pipeline never materialises (dev/slab.html checks slab == full3d)
  const pipe = new Pipeline(gl, grid, { mode: 'full3d' });
  const payload = pipe.createPayload();
  pipe.run(d.cosmo, d.A, payload, { seed: 1, smoothR: SMOOTH_R });

  await tick(`${label}: summing the analytic mode grid (${(nx * ny * nz / 1e3).toFixed(0)}k modes)…`);
  const a = analytic(grid, d.cosmo, d.A, SMOOTH_R);

  // Average over independent seeds so the comparison is against the ensemble
  // mean, with the tolerance set by the realisation scatter rather than guessed.
  const NSEED = 8;
  let aD = 0, aPx = 0, aPy = 0, m = null;
  for (let sd = 1; sd <= NSEED; sd++) {
    await tick(`${label}: synthesising + measuring seed ${sd}/${NSEED}…`);
    pipe.run(d.cosmo, d.A, payload, { seed: sd, smoothR: SMOOTH_R });
    const mi = measure(gl, pipe, grid);
    aD += mi.varD; aPx += mi.varPsiX; aPy += mi.varPsiY;
    if (sd === 1) m = mi;
  }
  aD /= NSEED; aPx /= NSEED; aPy /= NSEED;
  const sigD = Math.sqrt(2 / (a.nEffD * NSEED)), sigP = Math.sqrt(2 / (a.nEffPsi * NSEED));

  section(`${label}  (box ${grid.boxXY} x ${grid.boxXY} x ${grid.boxZ.toFixed(0)} Mpc/h,` +
          ` mean of ${NSEED} seeds)`);
  rows.push(`<tr><td colspan="5" style="color:var(--ink-muted)">effective modes: ` +
            `delta_L N_eff=${a.nEffD.toFixed(0)} (1σ=${(100 * sigD).toFixed(2)}%), ` +
            `Psi N_eff=${a.nEffPsi.toFixed(0)} (1σ=${(100 * sigP).toFixed(1)}%)</td></tr>`);
  row('Var[delta_L]  (smoothed R=4)', aD, a.varD, Math.max(3 * sigD, 0.01));
  row('Var[Psi_x]   [(Mpc/h)^2]', aPx, a.varPsi, Math.max(3 * sigP, 0.01));
  row('Var[Psi_y]   [(Mpc/h)^2]', aPy, a.varPsi, Math.max(3 * sigP, 0.01));
  rows.push(`<tr><td>mean delta_L (should be ~0)</td><td class="n">${m.meanD.toExponential(2)}</td>` +
            `<td class="n">0</td><td class="n">—</td><td class="${Math.abs(m.meanD) < 1e-4 ? 'pass' : 'fail'}">${Math.abs(m.meanD) < 1e-4 ? 'PASS' : 'FAIL'}</td></tr>`);
  const rel = m.spurIm / Math.sqrt(m.varD);
  rows.push(`<tr><td>spurious imaginary part / rms(delta_L)<br><small>non-zero means Hermitian symmetry is broken</small></td>` +
            `<td class="n">${rel.toExponential(2)}</td><td class="n">0</td><td class="n">—</td>` +
            `<td class="${rel < 1e-4 ? 'pass' : 'fail'}">${rel < 1e-4 ? 'PASS' : 'FAIL'}</td></tr>`);
  endSection();

  // --- Parseval on the k-space synth output, to separate synthesis from transform ---
  {
    await tick(`${label}: Parseval check on the k-space synthesis…`);
    pipe.run(d.cosmo, d.A, payload, { seed: 1, smoothR: SMOOTH_R, stopAfterSynth: true });
    const kbuf2 = readFloat(gl, pipe.volumeFb, pipe.vol.atlasW, pipe.vol.atlasH);
    const ixk = makeIndexer(nx, ny, nz);
    const N = nx * ny * nz;
    // C = Psi_x_hat + i Psi_y_hat  =>  Psi_x_hat(k) = (C(k) + conj(C(-k)))/2
    //                                  Psi_y_hat(k) = (C(k) - conj(C(-k)))/(2i)
    let sx = 0, sy = 0, sd = 0;
    for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
      const o = ixk.at(x, y, z) * 4;
      const on = ixk.at((nx - x) % nx, (ny - y) % ny, (nz - z) % nz) * 4;
      const cr = kbuf2[o], ci = kbuf2[o + 1], nr = kbuf2[on], ni = kbuf2[on + 1];
      const pxr = 0.5 * (cr + nr), pxi = 0.5 * (ci - ni);
      const pyr = 0.5 * (ci + ni), pyi = 0.5 * (nr - cr);
      sx += pxr * pxr + pxi * pxi;
      sy += pyr * pyr + pyi * pyi;
      sd += kbuf2[o + 2] * kbuf2[o + 2] + kbuf2[o + 3] * kbuf2[o + 3];
    }
    section(`${label} — Parseval on the k-space synth output (before the FFT)`);
    row('Var[Psi_x] from sum |Psi_x_hat|^2 / N^2', sx / (N * N), a.varPsi, 3 * Math.sqrt(2 / a.nEffPsi));
    row('Var[Psi_y] from sum |Psi_y_hat|^2 / N^2', sy / (N * N), a.varPsi, 3 * Math.sqrt(2 / a.nEffPsi));
    row('Var[delta_L] from sum |delta_hat|^2 / N^2', sd / (N * N), a.varD, 3 * Math.sqrt(2 / a.nEffD));
    endSection();
  }

  if (nz === 32) {
    // quick look: a delta_L slice and a Psi magnitude slice
    const draw = (title, fn) => {
      const c = document.createElement('canvas'); c.width = nx; c.height = ny;
      c.style.width = '256px'; c.style.height = '256px';
      const g2 = c.getContext('2d'); const im = g2.createImageData(nx, ny);
      const vals = new Float64Array(nx * ny);
      for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
        const o = m.ix.at(x, y, nz >> 1) * 4;
        vals[y * nx + x] = fn(m.buf[o], m.buf[o + 1], m.buf[o + 2]);
      }
      let lo = Infinity, hi = -Infinity;
      for (const v of vals) { if (v < lo) lo = v; if (v > hi) hi = v; }
      for (let i = 0; i < vals.length; i++) {
        const t = Math.round(255 * (vals[i] - lo) / (hi - lo));
        im.data[i * 4] = t; im.data[i * 4 + 1] = t; im.data[i * 4 + 2] = t; im.data[i * 4 + 3] = 255;
      }
      g2.putImageData(im, 0, 0);
      const fig = document.createElement('figure');
      fig.appendChild(c);
      const cap = document.createElement('figcaption');
      cap.textContent = `${title}  [${lo.toFixed(2)}, ${hi.toFixed(2)}]`;
      fig.appendChild(cap);
      document.getElementById('slices').appendChild(fig);
    };
    draw('delta_L, mid slice', (px, py, dl) => dl);
    draw('|Psi| [Mpc/h], mid slice', (px, py) => Math.hypot(px, py));
    draw('Psi_x [Mpc/h], mid slice', (px) => px);
    window.__field = () => {
      const { nx: NX, ny: NY, nz: NZ } = grid;
      const o = new Float32Array(NX * NY * NZ * 3);
      let i = 0;
      for (let z = 0; z < NZ; z++) for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
        const p = m.ix.at(x, y, z) * 4;
        o[i++] = m.buf[p]; o[i++] = m.buf[p + 1]; o[i++] = m.buf[p + 2];
      }
      return { shape: [NX, NY, NZ], box: [grid.boxXY, grid.boxXY, grid.boxZ],
               data: Array.from(o.subarray(0, o.length)) };
    };
  }
  payload.fb && gl.deleteFramebuffer(payload.fb);
  gl.deleteTexture(payload.tex);
  pipe.dispose();
}
status.textContent = 'done.';
window.__done = true;
</script>
</body>
</html>
